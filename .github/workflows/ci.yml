# Tipos, lint, testes, build e orçamento de JS em todo push e pull request.
# Sem segredos: os testes simulam o modelo com fetch falso e o build não chama a IA.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    name: tipos, lint, testes, build e orçamento
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - run: npm ci

      # next-env.d.ts e os tipos das rotas (PageProps) são gerados, não versionados
      - name: Tipos
        run: npx next typegen && npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Testes
        run: npx vitest run --maxWorkers=2

      - name: Build
        run: npm run build

      - name: Orçamento de JS por rota
        run: npm run orcamento
